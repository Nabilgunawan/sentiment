- name: Push to hub
  env:
    HF_TOKEN: ${{ secrets.HF_TOKEN }}
  run: |
    git remote add huggingface https://Nabilgunawan:$HF_TOKEN@huggingface.co/spaces/Nabilgunawan/SentimentAnalysist
    
    # Retry logic with exponential backoff
    max_attempts=3
    for ((i=1; i<=max_attempts; i++)); do
      if git fetch huggingface main && git merge --allow-unrelated-histories -X ours huggingface/main && git push huggingface main; then
        echo "Successfully pushed to Hugging Face"
        break
      else
        if [ $i -lt $max_attempts ]; then
          wait_time=$((2 ** i))
          echo "Attempt $i failed. Retrying in ${wait_time} seconds..."
          sleep $wait_time
        else
          echo "Failed after $max_attempts attempts"
          exit 1
        fi
      fi
    done
